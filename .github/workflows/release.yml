name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/release-metadata.mjs

  build:
    needs: validate
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            command: npx electron-builder --win nsis --x64 --publish never
          - platform: mac-arm64
            os: macos-15
            command: npx electron-builder --mac --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
          - platform: mac-x64
            os: macos-15-intel
            command: npx electron-builder --mac --x64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
          - platform: linux-x64
            os: ubuntu-22.04
            command: npx electron-builder --linux --x64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Electron worker smoke
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs
      - name: Electron worker smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs
      - name: Package
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/*-setup.exe
            release/*-mac-*.dmg
            release/*-mac-*.zip
            release/*-linux-*.AppImage
            release/*-linux-*.tar.gz

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Verify all packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
